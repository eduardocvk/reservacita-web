<style>
/* ═══════════════════════════════════════════════════════════
   ReservaCita — Eduardo Callejo Osteopatía Madrid
   Design System & Styles
   ═══════════════════════════════════════════════════════════ */

/* ─── Variables de Tema ─── */
:root {
  /* Paleta de marca — derivada del logo */
  --primary: #2A9D8F;
  --primary-hover: #238B7E;
  --primary-light: #E8F5F3;
  --primary-lighter: #F0FAF8;
  --primary-dark: #1A6B61;

  --secondary: #264653;
  --secondary-light: #3A7D8C;

  --accent: #5CB896;
  --accent-light: #A8DCC5;

  /* Gradiente de marca */
  --gradient-brand: linear-gradient(135deg, #2A9D8F 0%, #5CB896 100%);
  --gradient-brand-hover: linear-gradient(135deg, #238B7E 0%, #4DAA88 100%);
  --gradient-dark: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);

  /* Fondos */
  --bg-white: #FFFFFF;
  --bg-light: #F8FAFB;
  --bg-card: rgba(255, 255, 255, 0.97);

  /* Textos */
  --text-dark: #1A1A2E;
  --text-body: #4A4A5A;
  --text-muted: #8E8E9E;
  --text-light: #FFFFFF;

  /* Estados */
  --success: #2ECC71;
  --success-light: #E8F8EF;
  --warning: #F39C12;
  --warning-light: #FEF5E7;
  --danger: #E74C3C;
  --danger-light: #FDEDEC;
  --info: #3498DB;
  --info-light: #EBF5FB;

  /* Bordes y sombras */
  --border: #E8ECF0;
  --border-light: #F0F2F5;
  --shadow-xs: 0 1px 3px rgba(38, 70, 83, 0.04);
  --shadow-sm: 0 2px 8px rgba(38, 70, 83, 0.06);
  --shadow-md: 0 4px 16px rgba(38, 70, 83, 0.08);
  --shadow-lg: 0 8px 32px rgba(38, 70, 83, 0.12);
  --shadow-xl: 0 16px 48px rgba(38, 70, 83, 0.16);

  /* Radios */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 50%;

  /* Tipografías */
  --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: 'Playfair Display', Georgia, serif;

  /* Transiciones */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --transition: all 0.3s var(--ease);
  --transition-fast: all 0.15s var(--ease);
}

/* ─── Reset ─── */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-primary);
  color: var(--text-body);
  font-size: 14px;
  line-height: 1.6;
  background: var(--bg-white);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img { max-width: 100%; height: auto; }
a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-hover); }

/* ═══════════════════════════════════════════════════════════
   VISTA PÚBLICA — Reserva de citas
   ═══════════════════════════════════════════════════════════ */

/* ─── Layout Público ─── */
.public-wrapper {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-white);
}

.public-header {
  padding: 24px 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border-light);
  background: var(--bg-white);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-logo {
  height: 56px;
  width: auto;
  object-fit: contain;
  transition: var(--transition);
}

.header-logo:hover {
  transform: scale(1.03);
}

.booking-container {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 32px 20px 48px;
}

.booking-content {
  width: 100%;
  max-width: 640px;
}

.public-footer {
  padding: 20px 32px;
  text-align: center;
  border-top: 1px solid var(--border-light);
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

.public-footer a {
  color: var(--text-muted);
  transition: var(--transition-fast);
}

.public-footer a:hover {
  color: var(--primary);
}

.admin-link {
  opacity: 0.4;
  font-size: 11px;
}

.admin-link:hover {
  opacity: 1;
}

.whatsapp-float {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #25D366 !important;
  font-weight: 500;
}

.whatsapp-float:hover {
  color: #128C7E !important;
}

/* ─── Steps Indicator ─── */
.steps-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 40px;
  gap: 0;
}

.step-item {
  display: flex;
  align-items: center;
  gap: 0;
}

.step-circle {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 14px;
  border: 2px solid var(--border);
  color: var(--text-muted);
  background: var(--bg-white);
  transition: var(--transition);
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}

.step-circle.active {
  border-color: var(--primary);
  background: var(--primary);
  color: var(--text-light);
  box-shadow: 0 0 0 4px var(--primary-light);
}

.step-circle.completed {
  border-color: var(--primary);
  background: var(--primary);
  color: var(--text-light);
}

.step-line {
  width: 48px;
  height: 2px;
  background: var(--border);
  transition: var(--transition);
  flex-shrink: 0;
}

.step-line.completed {
  background: var(--primary);
}

.step-label {
  display: none;
}

/* ─── Wizard Steps ─── */
.wizard-step {
  display: none;
  animation: stepFadeIn 0.4s var(--ease);
}

.wizard-step.active {
  display: block;
}

@keyframes stepFadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 6px;
}

.step-subtitle {
  font-size: 15px;
  color: var(--text-muted);
  margin-bottom: 28px;
}

/* ─── Service Cards ─── */
.services-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.service-card {
  background: var(--bg-white);
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: flex-start;
  gap: 16px;
  position: relative;
  overflow: hidden;
}

.service-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gradient-brand);
  opacity: 0;
  transition: var(--transition);
}

.service-card:hover {
  border-color: var(--primary-light);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.service-card:hover::before {
  opacity: 1;
}

.service-card.selected {
  border-color: var(--primary);
  background: var(--primary-lighter);
  box-shadow: var(--shadow-md);
}

.service-card.selected::before {
  opacity: 1;
}

.service-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.service-card.selected .service-icon {
  background: var(--primary);
  color: var(--text-light);
}

.service-info {
  flex: 1;
}

.service-name {
  font-weight: 600;
  font-size: 16px;
  color: var(--text-dark);
  margin-bottom: 4px;
}

.service-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
  line-height: 1.5;
}

.service-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}

.service-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--text-body);
}

.service-meta .price {
  font-weight: 700;
  color: var(--primary-dark);
}

.service-check {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 24px;
  height: 24px;
  border-radius: var(--radius-full);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  transition: var(--transition);
  font-size: 13px;
}

.service-card.selected .service-check {
  border-color: var(--primary);
  background: var(--primary);
  color: var(--text-light);
}

/* ─── Calendario ─── */
.calendar-container {
  margin-bottom: 24px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.calendar-month-label {
  font-weight: 600;
  font-size: 16px;
  color: var(--text-dark);
  text-transform: capitalize;
}

.calendar-nav {
  display: flex;
  gap: 8px;
}

.calendar-nav-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-white);
  color: var(--text-body);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: var(--transition-fast);
}

.calendar-nav-btn:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}

.calendar-nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.calendar-weekday {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 0;
}

.calendar-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition-fast);
  color: var(--text-body);
  position: relative;
}

.calendar-day:hover:not(.disabled):not(.empty) {
  background: var(--primary-light);
  color: var(--primary);
}

.calendar-day.today {
  font-weight: 700;
  color: var(--primary);
}

.calendar-day.today::after {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 4px;
  height: 4px;
  background: var(--primary);
  border-radius: var(--radius-full);
}

.calendar-day.selected {
  background: var(--primary);
  color: var(--text-light);
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(42, 157, 143, 0.3);
}

.calendar-day.selected::after {
  background: var(--text-light);
}

.calendar-day.disabled {
  color: var(--border);
  cursor: not-allowed;
  opacity: 0.4;
}

.calendar-day.empty {
  cursor: default;
}

.calendar-day.has-slots::before {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 6px;
  height: 2px;
  background: var(--success);
  border-radius: 1px;
}

/* ─── Time Slots ─── */
.slots-container {
  margin-top: 8px;
}

.slots-label {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-dark);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.slots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px;
}

.slot-btn {
  padding: 10px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-white);
  color: var(--text-body);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition-fast);
  text-align: center;
  font-family: var(--font-primary);
}

.slot-btn:hover:not(.disabled) {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
}

.slot-btn.selected {
  border-color: var(--primary);
  background: var(--primary);
  color: var(--text-light);
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(42, 157, 143, 0.3);
}

.slot-btn.disabled {
  opacity: 0.3;
  cursor: not-allowed;
  text-decoration: line-through;
}

.slots-empty {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-muted);
  font-size: 14px;
  background: var(--bg-light);
  border-radius: var(--radius-md);
}

.slots-empty i {
  font-size: 32px;
  display: block;
  margin-bottom: 8px;
  color: var(--border);
}

.slots-loading {
  text-align: center;
  padding: 32px;
}

.slots-loading .mini-spinner {
  width: 24px;
  height: 24px;
  border: 3px solid var(--primary-light);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 8px;
}

/* ─── Formulario de datos ─── */
.form-section {
  margin-bottom: 24px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
  color: var(--text-dark);
  font-size: 13px;
}

.form-group label .required {
  color: var(--danger);
  margin-left: 2px;
}

.form-control {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font-primary);
  transition: var(--transition-fast);
  background: var(--bg-white);
  color: var(--text-dark);
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}

.form-control.error {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px var(--danger-light);
}

.form-control::placeholder {
  color: var(--text-muted);
}

textarea.form-control {
  min-height: 80px;
  resize: vertical;
}

.form-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.form-error {
  font-size: 12px;
  color: var(--danger);
  margin-top: 4px;
  display: none;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}


/* Checkbox personalizado */
.checkbox-group {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  margin-top: 16px;
}

.checkbox-group input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  margin-top: 2px;
  flex-shrink: 0;
}

.checkbox-group label {
  font-size: 13px;
  color: var(--text-body);
  cursor: pointer;
  line-height: 1.5;
}

/* ─── Resumen de la cita ─── */
.booking-summary {
  background: var(--bg-light);
  border-radius: var(--radius-lg);
  padding: 24px;
  border: 1px solid var(--border-light);
}

.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-light);
}

.summary-row:last-child {
  border-bottom: none;
}

.summary-label {
  font-size: 13px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.summary-value {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-dark);
  text-align: right;
}

.summary-total {
  background: var(--primary-light);
  margin: 16px -24px -24px;
  padding: 16px 24px;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.summary-total .summary-label {
  font-weight: 600;
  color: var(--text-dark);
  font-size: 15px;
}

.summary-total .summary-value {
  font-size: 20px;
  color: var(--primary-dark);
}

/* ─── Pantalla de éxito ─── */
.success-screen {
  text-align: center;
  padding: 40px 20px;
}

.success-icon {
  width: 80px;
  height: 80px;
  border-radius: var(--radius-full);
  background: var(--success-light);
  color: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  margin: 0 auto 20px;
  animation: successPop 0.5s var(--ease);
}

@keyframes successPop {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

.success-title {
  font-family: var(--font-display);
  font-size: 26px;
  color: var(--text-dark);
  margin-bottom: 8px;
}

.success-message {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 24px;
}

.success-details {
  background: var(--bg-light);
  border-radius: var(--radius-md);
  padding: 20px;
  text-align: left;
  margin-bottom: 24px;
}

.success-whatsapp {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: #25D366;
  color: white !important;
  border-radius: var(--radius-sm);
  font-weight: 500;
  margin-top: 8px;
  transition: var(--transition-fast);
}

.success-whatsapp:hover {
  background: #128C7E;
  transform: translateY(-1px);
  color: white !important;
}

/* ─── Botones ─── */
.btn {
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  cursor: pointer;
  border: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: var(--transition);
  font-size: 14px;
  font-family: var(--font-primary);
  line-height: 1;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.btn-primary {
  background: var(--gradient-brand);
  color: var(--text-light);
  box-shadow: 0 4px 12px rgba(42, 157, 143, 0.25);
}

.btn-primary:hover:not(:disabled) {
  background: var(--gradient-brand-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(42, 157, 143, 0.35);
}

.btn-secondary {
  background: var(--bg-white);
  color: var(--text-body);
  border: 1.5px solid var(--border);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--bg-light);
  border-color: var(--primary);
  color: var(--primary);
}

.btn-danger {
  background: var(--danger);
  color: var(--text-light);
}

.btn-danger:hover:not(:disabled) {
  background: #C0392B;
  transform: translateY(-1px);
}

.btn-sm {
  padding: 8px 14px;
  font-size: 13px;
}

.btn-lg {
  padding: 14px 32px;
  font-size: 16px;
}

.btn-block {
  width: 100%;
}

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-white);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition-fast);
}

.btn-icon:hover {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary);
}

.wizard-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 32px;
  gap: 12px;
}

/* ═══════════════════════════════════════════════════════════
   VISTA ADMIN — Panel de administración
   ═══════════════════════════════════════════════════════════ */

/* ─── Layout Admin ─── */
.admin-body {
  background: var(--bg-light);
  overflow: hidden;
}

.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ─── Sidebar ─── */
.sidebar {
  width: 260px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 0;
  box-shadow: var(--shadow-sm);
  z-index: 10;
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-header {
  display: flex;
  align-items: center;
  padding: 0 20px 28px;
  gap: 12px;
}

.sidebar-logo {
  width: 44px;
  height: 44px;
  object-fit: contain;
}

.sidebar-header h2 {
  font-size: 15px;
  font-weight: 700;
  color: var(--secondary);
  line-height: 1.3;
}

.sidebar-header h2 span {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.nav-links {
  list-style: none;
  flex: 1;
}

.nav-item {
  padding: 12px 20px;
  display: flex;
  align-items: center;
